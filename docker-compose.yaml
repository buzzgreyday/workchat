services:

  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Listed without a value on purpose. Compose then forwards it only when it
      # is set in the shell, so `OPENAI_MODEL=gpt-4.1-mini docker compose up -d
      # backend` pins an eval arm without editing anything, and an unset one
      # leaves whatever backend/.env says intact. Writing `${OPENAI_MODEL:-}`
      # instead would inject an empty string and silently override the env file.
      - OPENAI_MODEL
    # Dev only. entrypoint.sh runs `alembic upgrade head` and then execs "$@",
    # so this replaces its default uvicorn invocation. --reload-dir keeps the
    # watcher off the whole bind mount, which would otherwise include
    # /app/.venv and alembic/. resources/ is watched because the CV index is
    # built at startup: editing a record reloads the app and rebuilds it, with
    # no command to remember. --reload-include is needed with it — uvicorn's
    # watcher matches *.py only by default, so the markdown would be watched
    # in name and ignored in fact.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir resources --reload-include '*.py' --reload-include '*.md'
    healthcheck:
      # python, not curl: the python:3.13-slim base image ships no curl, so the
      # previous probe could only ever fail with "executable file not found".
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      args:
        UID: "1000"
        GID: "1000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Stop at deps (full node_modules incl. devDependencies, no build) —
      # the default final stage is the standalone prod image, whose CMD
      # needs server.js, which the bind mount below would wipe out anyway.
      target: deps
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  postgres_data: