[project]
name = "cv"
version = "0.1.10"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "fastapi[standard]==0.140.13",
    "openai>=2.50.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "qrcode[pil]>=8.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
