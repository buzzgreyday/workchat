# Pinned so the project name never depends on the directory name. Volumes are
# named <project>_<volume>, so a rename of the checkout directory would
# otherwise point Compose at fresh, empty volumes -- silently orphaning the
# Postgres data. Must stay "ai-cv": that is what the live volumes are called.
name: ai-cv

services:

  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      args:
        UID: "1000"
        GID: "1000"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      # Read-only: the container scans this at startup and never writes to it.
      # Nothing in the image builds an index or rewrites skills.md any more, so
      # the mount enforces what was previously only a convention — and the
      # chown step the old index build needed goes with it.
      - ./backend/resources:/app/resources:ro
    expose:
      - "8000"
    healthcheck:
      # python, not curl: the python:3.13-slim base image ships no curl, so the
      # previous probe could only ever fail with "executable file not found".
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      # Whose CV this is. Read on the server per request, so changing one of
      # these is a restart rather than a rebuild — unlike NEXT_PUBLIC_API_URL
      # above, which next build inlines into the browser bundle.
      #
      # `${VAR-default}`, not `${VAR:-default}`: the colon form also substitutes
      # when the variable is set but empty, which would make "I have no LinkedIn"
      # render the author's.
      OWNER_NAME: ${OWNER_NAME-Michael}
      OWNER_GITHUB_URL: ${OWNER_GITHUB_URL-https://github.com/buzzgreyday}
      OWNER_LINKEDIN_URL: ${OWNER_LINKEDIN_URL-https://linkedin.com/in/michael-ringdal}
    expose:
      - "3000"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
